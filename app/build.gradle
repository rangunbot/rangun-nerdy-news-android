plugins {
    id 'com.android.application'
}

android {
    namespace 'de.bastkowski.rangun'
    compileSdk 35

    defaultConfig {
        applicationId "de.bastkowski.rangun"
        minSdk 26
        targetSdk 35
        versionCode 20260812
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
